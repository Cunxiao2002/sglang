[remote]
# Optional if the current repo can be auto-detected from `mutagen sync list`.
mutagen_session = my-sync
ssh_target = user@remote-host
remote_workspace_root = /home/user/project

# Optional shell snippet executed before Python starts.
# Keep it empty if the default login shell already has the right environment.
bootstrap = source ~/.bashrc && conda activate your_env

# Remote executable used to run the mapped script.
python = python3
remote_shell = bash

# Optional extra SSH options, written the same way you would type them in a shell.
# ssh_options = -o BatchMode=yes -o StrictHostKeyChecking=yes

# Local directory for logs and run metadata.
artifact_dir = remote-run/artifacts
